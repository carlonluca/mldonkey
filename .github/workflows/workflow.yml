name: Build

on:
  - push
  - pull_request

jobs:
  static-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64]
    container:
      image: alpine:3.22
    steps:
      - name: Install build dependencies
        run: |
          apk add --no-cache \
            bash git build-base pkgconfig \
            ocaml ocaml-compiler-libs ocaml-findlib dune \
            opam curl-dev zlib-dev bzip2-dev \
            libidn2-dev libunistring-dev libpsl-dev \
            brotli-dev zstd-dev c-ares-dev \
            openssl-dev \
            miniupnpc-dev libnatpmp-dev file-dev \
            gd-dev libpng-dev jpeg-dev python3 m4 curl-dev \
            curl-static zlib-static bzip2-static libmagic-static \
            libpng openssl-libs-static libpng-static libjpeg-turbo-static \
            nghttp2-static openssl-dev openssl-libs-static \
            libidn2-static brotli-static libpsl-static libunistring-static \
            zstd-static c-ares-dev brotli-static git git-lfs musl
          apk add m4

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Init opam
        run: |
          opam init --disable-sandboxing --bare --yes --jobs=$(nproc)
          eval $(opam env)
          opam switch create musl-static ocaml-variants.5.3.0+options --no-install
      - name: Install OCaml deps
        run: |
          git config --global --add safe.directory .
          eval $(opam env --switch=musl-static)
          opam install . --deps-only --yes --jobs=$(nproc)
      - name: Build cryptopp statically
        run: |
          git clone https://github.com/weidai11/cryptopp.git
          cd cryptopp
          make static
          make install
          cd ..
      - name: Embed libmagic db
        run: |
          apk add file
          xxd -i /usr/share/misc/magic.mgc > src/utils/lib/magic_data.c
      - name: Build
        run: |
          eval $(opam env --switch=musl-static)
          python autoconf.py
          opam exec -- dune build --profile=static
      
      - name: Set short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlnet-static-${{ matrix.arch }}-${{ env.SHORT_SHA }}
          path: _build/default/src/mlnet.exe

  build:
    continue-on-error: ${{ ! matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        ocaml-version:
          #- 5.3.0
          #- 5.4.1
          - 5.5.2
        required:
          - true
        os:
          - ubuntu-latest
        #include:
        #  - ocaml-version: 5.4.1
        #    required: true
        #    os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Use OCaml ${{ matrix.ocaml-version }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-version }}

      - run: |
          sudo apt update
          sudo apt install libcrypto++-dev libminiupnpc-dev libnatpmp-dev libgd-dev libcurl4-gnutls-dev zlib1g-dev m4 build-essential libz-dev libbz2-dev libmagic-dev libupnp-dev librsvg2-dev libc6-dev python-is-python3 libcrypto++-dev git git-lfs libnghttp2-dev libc-ares-dev libidn2-dev libunistring-dev libpsl-dev gzip
        if: matrix.os == 'ubuntu-latest'

      - run: brew install cryptopp miniupnpc libnatpmp gd curl zlib bzip2 libmagic librsvg nghttp2 c-ares libidn2 libunistring libpsl git git-lfs m4
        if: matrix.os == 'macos-latest'

      - run: |
          echo "CPATH=$HOMEBREW_PREFIX/include:$CPATH" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$HOMEBREW_PREFIX/lib:$LIBRARY_PATH" >> $GITHUB_ENV
        if: matrix.os == 'macos-latest'

      - run: |
          echo $CPATH
          echo $C_INCLUDE_PATH
          echo $LIBRARY_PATH
          which -a pkg-config
          # ls -hlA $HOMEBREW_PREFIX/lib/pkgconfig
          # pkg-config --list-all
          pkg-config --cflags libcrypto++ || true # NB libcryptopp on linux :facepalm.jpg:
          pkg-config --libs libcrypto++ || true
          echo "" | cpp -v || true
        name: show build environment
        continue-on-error: true

      # not needed, opam install will do it automatically
      # - run: opam depext mldonkey --yes --with-doc --with-test

      - name: Show git status
        run: |
          git status
          git log -1
      - run: python autoconf.py
      - run: opam install . --deps-only --with-doc --with-test
      - run: opam install . --deps-only --yes
      - run: opam exec -- dune build --profile=release

      - name: Upload the build artifact
        if: ${{ matrix.ocaml-version == '5.4.1' }}
        uses: actions/upload-artifact@v4
        with:
          name: mlnet-${{ matrix.os }}.exe
          path: mlnet

  build-windows:
    # Same "allowed to fail" behaviour as the old windows-latest matrix entry
    continue-on-error: true
    runs-on: windows-latest

    # Every `run:` step below executes inside MSYS2 (UCRT64), like the
    # Alpine container does for the static Linux build.
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Don't convert line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Equivalent of the `apk add ...` step on Alpine.
      # `release: false` reuses the MSYS2 pre-installed on the runner (C:\msys64),
      # which is the same one setup-ocaml uses with `windows-environment: msys2`,
      # so the libraries installed here are the ones the OCaml C stubs link against.
      # `:p` = mingw-w64-ucrt-x86_64- prefix.
      - name: Setup MSYS2 and install C dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          path-type: inherit # keep opam/ocaml from setup-ocaml visible in the msys2 shell
          install: >-
            git
            make
            m4
          pacboy: >-
            toolchain:p
            pkgconf:p
            python:p
            curl:p
            zlib:p
            bzip2:p
            openssl:p
            nghttp2:p
            brotli:p
            zstd:p
            c-ares:p
            libidn2:p
            libunistring:p
            libpsl:p
            miniupnpc:p
            libnatpmp:p
            libgd:p
            libpng:p
            libjpeg-turbo:p
            file:p
            crypto++:p

      - name: Use OCaml 5.3.0 (MSYS2 UCRT64 toolchain)
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          windows-compiler: mingw
          windows-environment: msys2

      - name: Show build environment
        continue-on-error: true
        run: |
          ls -l /ucrt64/include/bzlib.h /ucrt64/lib/libbz2.a
          which -a gcc
          gcc -print-search-dirs | head -3
          echo | gcc -E -Wp,-v -x c - 2>&1 | grep -A8 'search starts'
          echo "MSYSTEM=$MSYSTEM"
          which -a gcc pkg-config python opam ocamlfind dune || true
          gcc --version
          opam --version
          ocamlfind ocamlopt -config | grep -E 'system|architecture|c_compiler' || true
          for p in libcurl libcrypto++ libmagic miniupnpc gdlib libpng; do
            echo "--- $p"; pkg-config --modversion $p || echo "MISSING: $p"
          done

      - name: Show git status
        run: |
          git config --global --add safe.directory '*'
          git status
          git log -1

      - name: Configure
        run: python autoconf.py

      - name: Install OCaml deps
        run: opam install . --deps-only --yes

      - name: Build
        run: opam exec -- dune build --profile=release

      # The exe is dynamically linked against the MSYS2 DLLs, so ship them next to it
      - name: Collect exe and runtime DLLs
        run: |
          mkdir dist
          cp _build/default/src/mlnet.exe dist/
          ldd dist/mlnet.exe | awk '/\/ucrt64\// {print $3}' | sort -u | xargs -r -I{} cp -v "{}" dist/
          ls -l dist

      - name: Set short SHA
        shell: pwsh
        run: |
          "SHORT_SHA=$(git rev-parse --short HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlnet-windows-x86_64-${{ env.SHORT_SHA }}
          path: dist/